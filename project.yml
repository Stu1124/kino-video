name: Kino
options:
  bundleIdPrefix: studio.kino
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

packages:
  KinoEngine:
    path: KinoEngine

targets:
  Kino:
    type: application
    platform: iOS
    sources:
      - path: Kino/Kino
    dependencies:
      - package: KinoEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.kino.app
        PRODUCT_NAME: Kino
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Kino"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Kino imports videos and photos from your library to build your edits."
        INFOPLIST_KEY_NSCameraUsageDescription: "Kino records video and photos for your edits."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Kino records audio and voice-overs for your edits."
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Kino imports music from your library into audio tracks."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

  KinoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Kino/KinoTests
    dependencies:
      - target: Kino
      - package: KinoEngine

  KinoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Kino/KinoUITests
    dependencies:
      - target: Kino

schemes:
  Kino:
    build:
      targets:
        Kino: all
        KinoTests: [test]
        KinoUITests: [test]
    test:
      targets:
        - KinoTests
        - KinoUITests
